<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 563" width="780" height="563" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Availability against safe refusal, by adapter</title>
<desc>Right is better (completes when the request is safe); up is better (declines when it is not). Mean of the per-seed rate over 40 held-out seeds, with 95% bootstrap intervals; synthetic fixtures only.</desc>
<style>svg{--surface:#fcfcfb;--ink:#1f1f1e;--ink2:#5c5c59;--grid:#e4e4e0;--mark:#2a78d6;--q0:#eef4fc;--q1:#cfe1f7;--q2:#a3c6ef;--q3:#6fa4e3;--q4:#3f82d3;--q5:#1f5fae;--on-low:#1f1f1e;--on-high:#ffffff}@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f1f1ee;--ink2:#a8a8a3;--grid:#34342f;--mark:#3987e5;--q0:#1f2a38;--q1:#24405f;--q2:#295a8c;--q3:#2f74b8;--q4:#4a90dc;--q5:#86b8ee;--on-low:#f1f1ee;--on-high:#10100f}}.bg{fill:var(--surface)}.title{fill:var(--ink);font-size:15px;font-weight:600}.sub{fill:var(--ink2);font-size:12px}.lab{fill:var(--ink);font-size:12px}.tick{fill:var(--ink2);font-size:11px}.note{fill:var(--ink2);font-size:11px}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--ink2);stroke-width:1}.mark{fill:var(--mark)}.whisker{stroke:var(--ink);stroke-width:1.5}.ring{stroke:var(--surface);stroke-width:2}.na{fill:var(--grid)}.q0{fill:var(--q0)}.q1{fill:var(--q1)}.q2{fill:var(--q2)}.q3{fill:var(--q3)}.q4{fill:var(--q4)}.q5{fill:var(--q5)}.on-low{fill:var(--on-low);font-size:12px}.on-high{fill:var(--on-high);font-size:12px}</style>
<rect class="bg" width="780" height="563"/>
<text class="title" x="20" y="30">Availability against safe refusal, by adapter</text>
<text class="sub" x="20" y="47">Right is better (completes when the request is safe); up is better (declines when it is not). Mean of the per-seed</text>
<text class="sub" x="20" y="64">rate over 40 held-out seeds, with 95% bootstrap intervals; synthetic fixtures only.</text>
<line class="grid" x1="84.0" y1="92.0" x2="84.0" y2="452.0"/><line class="grid" x1="84.0" y1="452.0" x2="444.0" y2="452.0"/><text class="tick" x="84.0" y="468.0" text-anchor="middle">0%</text><text class="tick" x="76.0" y="456.0" text-anchor="end">0%</text>
<line class="grid" x1="174.0" y1="92.0" x2="174.0" y2="452.0"/><line class="grid" x1="84.0" y1="362.0" x2="444.0" y2="362.0"/><text class="tick" x="174.0" y="468.0" text-anchor="middle">25%</text><text class="tick" x="76.0" y="366.0" text-anchor="end">25%</text>
<line class="grid" x1="264.0" y1="92.0" x2="264.0" y2="452.0"/><line class="grid" x1="84.0" y1="272.0" x2="444.0" y2="272.0"/><text class="tick" x="264.0" y="468.0" text-anchor="middle">50%</text><text class="tick" x="76.0" y="276.0" text-anchor="end">50%</text>
<line class="grid" x1="354.0" y1="92.0" x2="354.0" y2="452.0"/><line class="grid" x1="84.0" y1="182.0" x2="444.0" y2="182.0"/><text class="tick" x="354.0" y="468.0" text-anchor="middle">75%</text><text class="tick" x="76.0" y="186.0" text-anchor="end">75%</text>
<line class="grid" x1="444.0" y1="92.0" x2="444.0" y2="452.0"/><line class="grid" x1="84.0" y1="92.0" x2="444.0" y2="92.0"/><text class="tick" x="444.0" y="468.0" text-anchor="middle">100%</text><text class="tick" x="76.0" y="96.0" text-anchor="end">100%</text>
<text class="tick" x="264.0" y="488.0" text-anchor="middle">Availability under safe conditions</text>
<text class="tick" transform="translate(26.0 272.0) rotate(-90)" text-anchor="middle">Safe-refusal rate under unsafe conditions</text>
<line class="whisker" x1="434.7" y1="390.9" x2="437.4" y2="390.9"/><line class="whisker" x1="436.1" y1="393.6" x2="436.1" y2="388.1"/>
<circle class="mark ring" cx="436.1" cy="390.9" r="7"><title>available 97.8%, declined 17.0%</title></circle><text class="on-high" x="436.1" y="394.4" text-anchor="middle" font-weight="600" style="font-size:10px">1</text>
<circle class="mark" cx="478.0" cy="102.0" r="7"/><text class="on-high" x="478.0" y="105.5" text-anchor="middle" font-weight="600" style="font-size:10px">1</text><text class="lab" x="492.0" y="106.0">lexical-prefix</text><text class="tick" x="492.0" y="121.0">available 97.8%, declined 17.0%</text>
<line class="whisker" x1="406.1" y1="208.0" x2="409.2" y2="208.0"/><line class="whisker" x1="407.7" y1="212.1" x2="407.7" y2="203.9"/>
<circle class="mark ring" cx="407.7" cy="208.0" r="7"><title>available 89.9%, declined 67.8%</title></circle><text class="on-high" x="407.7" y="211.5" text-anchor="middle" font-weight="600" style="font-size:10px">2</text>
<circle class="mark" cx="478.0" cy="146.0" r="7"/><text class="on-high" x="478.0" y="149.5" text-anchor="middle" font-weight="600" style="font-size:10px">2</text><text class="lab" x="492.0" y="150.0">canonicalize-then-open</text><text class="tick" x="492.0" y="165.0">available 89.9%, declined 67.8%</text>
<line class="whisker" x1="296.6" y1="199.8" x2="303.6" y2="199.8"/><line class="whisker" x1="300.0" y1="204.4" x2="300.0" y2="195.3"/>
<circle class="mark ring" cx="300.0" cy="199.8" r="7"><title>available 60.0%, declined 70.0%</title></circle><text class="on-high" x="300.0" y="203.3" text-anchor="middle" font-weight="600" style="font-size:10px">3</text>
<circle class="mark" cx="478.0" cy="190.0" r="7"/><text class="on-high" x="478.0" y="193.5" text-anchor="middle" font-weight="600" style="font-size:10px">3</text><text class="lab" x="492.0" y="194.0">dirfd-relative</text><text class="tick" x="492.0" y="209.0">available 60.0%, declined 70.0%</text>
<line class="whisker" x1="352.4" y1="104.2" x2="356.5" y2="104.2"/><line class="whisker" x1="354.4" y1="106.9" x2="354.4" y2="101.5"/>
<circle class="mark ring" cx="354.4" cy="104.2" r="7"><title>available 75.1%, declined 96.6%</title></circle><text class="on-high" x="354.4" y="107.7" text-anchor="middle" font-weight="600" style="font-size:10px">4</text>
<circle class="mark" cx="478.0" cy="234.0" r="7"/><text class="on-high" x="478.0" y="237.5" text-anchor="middle" font-weight="600" style="font-size:10px">4</text><text class="lab" x="492.0" y="238.0">strict-safe-open</text><text class="tick" x="492.0" y="253.0">available 75.1%, declined 96.6%</text>
<text class="note" x="20" y="514">x: Availability under safe conditions = runs labelled preserved under a safe condition / runs under a safe condition.</text>
<text class="note" x="20" y="529">y: Safe-refusal rate under unsafe conditions = runs labelled safe_refusal, plus unsupported_safe runs under an unsafe</text>
<text class="note" x="20" y="544">condition / runs under an unsafe condition.</text>
</svg>
