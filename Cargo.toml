[package]
name = "policycontinuity"
version = "0.2.0"
edition = "2021"
description = "Controlled Linux benchmark: does a filesystem-containment policy survive state changes, retries, and fallbacks?"
readme = "README.md"
publish = false

[lib]
name = "policycontinuity"
path = "src/lib.rs"

[[bin]]
name = "policycontinuity"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
